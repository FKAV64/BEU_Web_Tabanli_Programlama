version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
      POSTGRES_DB: campusconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campusconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  nestjs:
    build: ./nestjs-service
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://campus:campus123@postgres:5432/campusconnect?schema=public
      JWT_SECRET: super-secret-key-change-me
      GO_WEBHOOK_URL: http://go:8080/api/v1/webhooks/events
    depends_on:
      postgres:
        condition: service_healthy

  go:
    build: ./go-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://campus:campus123@postgres:5432/campusconnect?sslmode=disable
      API_KEY: test-api-key-change-me
      WEBHOOK_SECRET: webhook-secret-change-me
    depends_on:
      - postgres

volumes:
  pgdata:
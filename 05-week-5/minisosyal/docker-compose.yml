services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: minisosyal_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: minisosyal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Service
  backend:
    build: .
    container_name: minisosyal_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:admin@db:5432/minisosyal"
      JWT_SECRET: "supersecretkey"
    depends_on:
      - db

  # Frontend Service
  frontend:
    build: ./client
    container_name: minisosyal_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000/api"
    depends_on:
      - backend

volumes:
  postgres_data: